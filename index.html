<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GreekStudy">
<meta name="theme-color" content="#061a2f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>GreekStudy prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--outer,#03101d);font-family:Nunito,system-ui,sans-serif;color:#fff;transition:background .5s}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:Fredoka,sans-serif;margin:0;font-weight:700}
#app{position:relative;width:100%;max-width:420px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transition:background .5s}
@media (min-width:600px) and (min-height:720px){#app{height:min(880px,calc(100dvh - 40px));margin-top:20px;border-radius:44px;box-shadow:0 30px 90px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08)}}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;bottom:-30px;border-radius:50%;background:var(--particle);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-1000px)}}
main{position:relative;flex:1;overflow-y:auto;padding:18px 16px 112px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.enter{animation:enter .35s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.col{display:flex;flex-direction:column}
.muted{color:var(--muted)}.sm{font-size:12px;font-weight:800}.xs{font-size:11px;font-weight:800}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border:2px solid var(--edge);border-radius:24px;padding:16px;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:6px 12px;font-weight:900;font-size:14px}
#ptsChip{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}
.btn3d{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:22px;background:var(--accent);color:var(--onAccent);border-bottom:6px solid var(--accentDark);font-family:Fredoka,sans-serif;font-weight:700;font-size:20px;height:66px;transition:transform .08s,border-width .08s}
.btn3d:active{transform:translateY(4px);border-bottom-width:2px}
.btn2{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border:0;border-radius:14px;background:var(--track);border-bottom:4px solid rgba(0,0,0,.35);font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;transition:transform .08s}
.btn2:active{transform:translateY(3px);border-bottom-width:1px}
.btn2.acc{background:var(--accent);color:var(--onAccent);border-bottom-color:var(--accentDark)}
.btn2.ghost{background:transparent;border:2px solid var(--edge)}
.bar{height:14px;background:var(--track);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .7s cubic-bezier(.2,1.3,.4,1)}
.bar.thin{height:8px}
.rar{font-size:11px;font-weight:900;letter-spacing:.6px;padding:4px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.r-Common{background:#4b5563;color:#f3f4f6}.r-Rare{background:#1f6fd1;color:#e6f1ff}.r-Epic{background:#7b4dff;color:#f1ebff}.r-Legendary{background:#f2a516;color:#2b1a00}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvl{width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:20px;border-bottom:4px solid var(--accentDark);flex-shrink:0}
.petstage{width:200px;height:182px;margin:4px auto 0;border-radius:50%;background:var(--glow);display:flex;align-items:center;justify-content:center;border:0;padding:0;position:relative}
.petstage.s3{background:radial-gradient(circle,var(--glow) 40%,transparent 72%),conic-gradient(from 0deg,#ffd23f33,#ff6ad533,#2fe0c833,#ffd23f33);}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.squish{animation:squish .45s}
@keyframes squish{30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.08)}}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.aura{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.d2{animation-delay:.9s}
@keyframes twinkle{50%{transform:scale(.4);opacity:.3}}
.float{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:20px;color:var(--coin);pointer-events:none;animation:floatup 1s forwards}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:2px solid var(--edge);padding:8px 6px 14px;z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:900;color:var(--muted);padding:6px 0;border-radius:16px;min-height:52px}
nav button.on{color:var(--accent);background:var(--track)}
nav svg{width:24px;height:24px}
#overlay{position:absolute;inset:0;z-index:40;pointer-events:none}
#overlay>*{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.backdrop.center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--card);border-top:2px solid var(--edge);border-radius:30px 30px 0 0;padding:20px 18px 26px;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.modal{width:100%;max-width:360px;background:var(--card);border:2px solid var(--edge);border-radius:30px;padding:22px 20px;text-align:center;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:56px;border-radius:16px;border:2px solid var(--edge);background:var(--bg);font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}
.seg button.on{background:var(--accent);color:var(--onAccent);border-color:var(--accentDark)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;background:var(--bg);border:2px solid var(--edge);border-radius:16px;padding:12px;text-align:left}
.sw{width:46px;height:28px;border-radius:999px;background:var(--track);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}.toggle[aria-pressed="true"] .sw::after{left:21px}
.session,.admin{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:18px 16px 24px;gap:14px;animation:fade .3s}
.admin{display:block;overflow-y:auto;scrollbar-width:none}
.ring{position:relative;width:250px;height:250px}
.ring svg{position:absolute;inset:0}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:Fredoka,sans-serif;font-size:56px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.bubble{background:#fff;color:#1b1030;border-radius:16px;padding:8px 12px;font-size:13px;font-weight:800;position:relative}
.bubble::after{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.stat{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:Fredoka,sans-serif;font-size:22px;font-variant-numeric:tabular-nums}
.slot{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:10px 4px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.slot.active{border-color:var(--accent);background:var(--track)}
.slot svg{width:84px;height:78px}
.slot .nm{font-family:Fredoka,sans-serif;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stars{color:#ffd23f;font-size:12px;letter-spacing:1px}
.stars i{color:rgba(255,255,255,.2);font-style:normal}
.sil{filter:brightness(0) opacity(.35)}
.egg{animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
.egg.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.glow-Legendary{box-shadow:0 0 0 6px rgba(242,165,22,.25),0 0 60px rgba(242,165,22,.55)}
.glow-Epic{box-shadow:0 0 0 6px rgba(123,77,255,.25),0 0 50px rgba(123,77,255,.5)}
.glow-Rare{box-shadow:0 0 0 6px rgba(31,111,209,.25),0 0 40px rgba(31,111,209,.45)}
.reveal{animation:reveal .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes reveal{from{transform:scale(0) rotate(-20deg)}}
.cf{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards;z-index:60;pointer-events:none}
@keyframes fall{to{transform:translateY(960px) rotate(720deg)}}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-90px);background:#fff;color:#14141f;font-weight:900;font-size:14px;padding:10px 16px;border-radius:999px;z-index:80;transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px solid var(--edge)}
.lb:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-weight:700;flex-shrink:0}
.tcard{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;border:3px solid transparent}
.tcard .scene{height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tcard .scene svg{width:86px;height:80px}
.shopitem{display:flex;align-items:center;gap:12px}
.ic{width:52px;height:52px;border-radius:16px;background:var(--track);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:28px;height:28px}
.math{background:var(--bg);border-radius:16px;padding:12px;text-align:left;font-size:13px;font-weight:800;line-height:1.7}
.math .tot{border-top:2px dashed var(--edge);margin-top:6px;padding-top:6px;font-size:15px}
.icon{width:18px;height:18px;flex-shrink:0}
.perk{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--edge);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:900}
.pgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;width:min(300px,78vw);aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none}
.pgrid div{background:var(--bg);border-radius:3px}
.pgrid div.on{background:var(--accent)}
.pgrid.ok div.on{background:#ffd23f}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:900;color:var(--muted)}
.fld input{height:42px;border-radius:12px;border:2px solid var(--edge);background:var(--card);color:#fff;font:inherit;font-size:15px;font-weight:800;padding:0 10px;width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex-shrink:0;border:2px solid var(--edge);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:900;font-size:12px}
.tabs button.on{background:var(--accent);color:var(--onAccent);border-color:var(--accentDark)}
.r-Boss{background:linear-gradient(90deg,#ff3b5c,#ff8a3a);color:#fff}
.slot.bossslot{border-color:#ff3b5c;background:linear-gradient(180deg,rgba(255,59,92,.18),var(--card))}
.slot .shinytag{font-size:10px;font-weight:900;background:linear-gradient(90deg,#ff6ad5,#ffd23f,#2fe0c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.shinychip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,#ff6ad5,#ffd23f,#2fe0c8);color:#1a1020}
.arena{position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,var(--glow),var(--bg) 72%);display:flex;flex-direction:column;padding:16px 16px 20px;gap:10px;overflow-y:auto;scrollbar-width:none;animation:fade .3s;transition:background .6s}
.arena.p3{background:radial-gradient(circle at 50% 36%,#5a1024,var(--bg) 72%)}
.hpbar{position:relative;height:20px;background:#2a0a16;border-radius:999px;overflow:hidden;border:2px solid #6b1f38}
.hpbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.hpbar>i.lag{background:#ffe0e6;transition:width .9s ease .25s}
.hpbar>i.fill{background:linear-gradient(90deg,#ff3b5c,#ff8a5a);transition:width .2s}
.hpbar>b{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);z-index:2}
.stagewrap{position:relative;height:280px;flex-shrink:0}
.bossbox{position:absolute;left:calc(50% - 135px);top:0;width:270px;height:250px;border:0;background:none;padding:0;cursor:crosshair;touch-action:manipulation}
.bossbox.rage{animation:rage .22s linear infinite}
@keyframes rage{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.bossart{width:100%;height:100%;animation:breathe 3s ease-in-out infinite;transform-origin:50% 90%;transition:filter .12s}
.bossart svg{width:100%;height:100%;overflow:visible}
.bossart.hit{filter:brightness(2.2) saturate(.4)}
@keyframes breathe{50%{transform:scale(1.035,.97)}}
.weak{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle,#fff 0 18%,#ffd23f 42%,rgba(255,210,63,.15) 72%);box-shadow:0 0 22px #ffd23f;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1);animation:pulse .7s ease-in-out infinite;padding:0}
@keyframes pulse{50%{transform:scale(1.2)}}
.petf{position:absolute;left:-6px;bottom:-4px;transition:transform .14s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.petf.lunge{transform:translate(46px,-26px) rotate(10deg) scale(1.08)}
.dmg{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none;animation:dmgup .9s forwards;z-index:4;white-space:nowrap}
.dmg.crit{color:#ffd23f;font-size:36px}
.dmg.pet{color:var(--accent);font-size:20px}
.dmg.ally{color:#d0d0e0;font-size:15px}
@keyframes dmgup{0%{transform:translate(-50%,0) scale(.5)}20%{transform:translate(-50%,-16px) scale(1.2)}100%{transform:translate(-50%,-74px) scale(1);opacity:0}}
.feed{display:flex;flex-direction:column;gap:5px;min-height:110px}
.feed div{font-size:12px;font-weight:800;background:var(--card);border-radius:10px;padding:6px 10px;animation:enter .3s}
.banner{position:absolute;left:50%;top:42%;font-family:Fredoka,sans-serif;font-weight:700;font-size:22px;padding:10px 18px;border-radius:16px;background:#ff3b5c;color:#fff;white-space:nowrap;animation:bannerIn 2.2s forwards;z-index:6;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner.heal{background:#2fbf71}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}12%{transform:translate(-50%,-50%) scale(1.12);opacity:1}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.ember{animation:ember 1.6s linear infinite;transform-box:fill-box}
.ember.e2{animation-delay:.5s}.ember.e3{animation-delay:1s}
@keyframes ember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.glowpulse{animation:gp 1.4s ease-in-out infinite}
@keyframes gp{50%{opacity:.35}}
.enchip.empty{animation:shake .4s;background:#5c1a2e;border-color:#ff3b5c}
.chestwrap{position:relative;width:220px;height:200px;margin:6px auto 0;display:flex;align-items:center;justify-content:center}
.chestbtn{background:none;border:0;padding:0;position:relative;z-index:2}
.chestbtn.idle svg{animation:wobble 2s ease-in-out infinite;transform-origin:50% 90%}
.chestbtn.tap svg{animation:shake .35s ease-in-out}
.rays{position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,170,.55) 0 10deg,transparent 10deg 30deg);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);z-index:1}
.loot{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--edge);border-radius:16px;padding:9px 12px;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;text-align:left}
.loot .li{width:44px;height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loot .li svg{max-width:44px;max-height:44px}
.loot.best{border-color:#ff3b5c;box-shadow:0 0 28px rgba(255,59,92,.45)}
.loot.goldglow{border-color:#ffd23f;box-shadow:0 0 22px rgba(255,210,63,.35)}
.rank{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;padding:5px 0}
.rank .rb{flex:1;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.rank .rb i{display:block;height:100%;background:var(--accent)}
.bosscard{background:linear-gradient(160deg,#3a1020,#22091a);border:2px solid #6b1f38;border-radius:24px;padding:14px;position:relative;overflow:hidden}
.tierline{font-size:12px;font-weight:900;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25)}
.t-gold{color:#ffd23f}.t-silver{color:#d6deea}.t-bronze{color:#e8a868}.t-none{color:#ff9db6}

.seg2{display:flex;gap:6px;background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:4px}
.seg2 button{flex:1;height:40px;border:0;border-radius:12px;background:none;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.seg2 button.on{background:var(--accent);color:var(--onAccent)}
.seg2 .dot,.ndot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff3b5c;border:2px solid var(--card)}
nav button{position:relative}
.ndot{top:4px;right:calc(50% - 18px)}
.qcard{padding:12px 14px}.qcard.claimed{opacity:.55}
.passhero{background:linear-gradient(150deg,#4a2a0a,#2a1608);border-color:#a8780a}
.ptier{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:8px 12px;opacity:.6}
.ptier.reached{opacity:1;border-color:var(--accent)}
.ptier.big{background:linear-gradient(90deg,rgba(255,210,63,.18),var(--card));border-color:#ffd23f}
.ptier .pnum{width:30px;height:30px;border-radius:10px;background:var(--track);display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-weight:700;flex-shrink:0}
.ptier.reached .pnum{background:var(--accent);color:var(--onAccent)}
.ptier .li{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ptier .li svg{max-width:30px;max-height:34px;width:28px;height:28px}
.sknode{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px}
.sknode.locked{opacity:.55}
.pips{display:flex;gap:4px;margin-top:2px}.pips i{width:16px;height:6px;border-radius:999px;background:var(--track)}
.badge{background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.badge b{font-family:Fredoka,sans-serif;font-size:13px}
.badge .xs{font-size:10px;line-height:1.3}
.badge.off .bdg{filter:grayscale(1);opacity:.5}
.bdg{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#14141f;border:3px solid rgba(255,255,255,.6);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.bdg svg{width:26px;height:26px}
.expslot{display:flex;align-items:center;gap:12px;width:100%;color:#fff}
.expslot.empty{border-style:dashed;cursor:pointer}
.expslot.locked{opacity:.55}
.expdur{display:flex;align-items:center;gap:10px;width:100%;color:#fff;cursor:pointer;padding:12px 14px}
/* no zooming: block pinch + double-tap zoom, and stop iOS auto-zoom on text fields */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,.bossbox,.weak,.chestbtn{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
/* ---------- tutorial ---------- */
#tut{position:absolute;inset:0;z-index:75;pointer-events:none}
#tut>*{pointer-events:auto}
.intro{position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,var(--glow),var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center;animation:fade .35s}
.introart{height:190px;display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.introart>svg,.introart>div{filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.introtitle{font-size:30px;margin:18px 0 10px;animation:enter .45s .05s both}
.introbody{font-size:16px;line-height:1.55;font-weight:700;color:var(--muted);max-width:330px;margin:0 0 22px;animation:enter .45s .12s both}
.introbody b{color:#fff}
.introskip{position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;background:none;border:0;color:var(--muted);font-weight:900;font-size:14px;padding:8px}
.dots{display:flex;gap:7px;margin-bottom:22px}.dots i{width:8px;height:8px;border-radius:999px;background:var(--track);transition:width .25s}.dots i.on{width:24px;background:var(--accent)}
.spot{position:absolute;border-radius:22px;box-shadow:0 0 0 2000px rgba(4,8,18,.72),0 0 0 3px var(--accent);transition:all .3s cubic-bezier(.3,1.2,.4,1);pointer-events:none;animation:spotpulse 1.6s ease-in-out infinite}
@keyframes spotpulse{50%{box-shadow:0 0 0 2000px rgba(4,8,18,.72),0 0 0 7px var(--accent)}}
.tourcard{position:absolute;left:16px;right:16px;background:var(--card);border:2px solid var(--accent);border-radius:22px;padding:14px 16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.tipsheet{max-height:86%;overflow-y:auto}
.tiplist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tiplist li{position:relative;background:var(--bg);border-radius:14px;padding:10px 12px 10px 34px;font-size:14px;font-weight:700;line-height:1.45;color:var(--muted);animation:enter .35s both}
.tiplist li b{color:#fff}
.tiplist li::before{content:"";position:absolute;left:13px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.helpbtn{width:34px;height:34px;flex-shrink:0;border-radius:50%;border:2px solid var(--edge);background:var(--card);color:var(--muted);font-family:Fredoka,sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
details.guide{background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:10px 12px}
details.guide summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;font-size:16px}
details.guide summary::-webkit-details-marker{display:none}
details.guide .chev{margin-left:auto;font-size:22px;color:var(--muted);transition:transform .2s}
details.guide[open] .chev{transform:rotate(90deg)}
details.guide .tiplist{margin-top:10px}
/* ---------- polish ---------- */
.enter .stack>*{animation:enter .42s cubic-bezier(.2,.9,.3,1) both}
.enter .stack>*:nth-child(2){animation-delay:.04s}.enter .stack>*:nth-child(3){animation-delay:.08s}.enter .stack>*:nth-child(4){animation-delay:.12s}.enter .stack>*:nth-child(5){animation-delay:.16s}.enter .stack>*:nth-child(6){animation-delay:.2s}.enter .stack>*:nth-child(n+7){animation-delay:.24s}
nav button.on::before{content:"";position:absolute;top:-10px;left:30%;right:30%;height:4px;border-radius:0 0 6px 6px;background:var(--accent)}
nav button svg{transition:transform .2s}nav button.on svg{transform:translateY(-1px) scale(1.08)}
.cta{position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,70%{left:-80px}100%{left:110%}}
#toast{display:flex;align-items:center;gap:8px}
#toast .ticon{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#toast .ticon svg{width:14px;height:14px}
.lvlup{font-family:Fredoka,sans-serif;font-weight:700;font-size:30px;color:#ffd23f;text-shadow:0 3px 0 #a8780a,0 0 24px rgba(255,210,63,.6);margin:-4px 0 8px;animation:lvl .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes lvl{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.2) rotate(3deg);opacity:1}100%{transform:scale(1)}}
.card{transition:transform .15s,border-color .2s}
button.card:active{transform:scale(.98)}
.seg2 button{transition:background .2s,color .2s}

.scene-svg{position:absolute;left:0;right:0;bottom:0;width:100%;opacity:.85}
.top-svg{position:absolute;left:0;right:0;top:0;width:100%;opacity:.9}
.sun{position:absolute;width:150px;height:150px;border-radius:50%;opacity:.55}

.fall{position:absolute;top:-30px;animation:fall linear infinite;display:block}

.ash{border-radius:50%;background:rgba(200,190,180,.35)}
.sprinkle{width:4px;height:12px;border-radius:3px;opacity:.75}
.snow{--rot:0deg}.snow i{display:block;border-radius:50%;background:#fff;opacity:.8;animation:sway ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.drift{position:absolute;left:0;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(560px)}}
.fog{width:320px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(200,190,230,.13),transparent 70%)}
.twk{position:absolute;animation:twinkle2 ease-in-out infinite}
@keyframes twinkle2{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:.9;transform:scale(1)}}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle2 ease-in-out infinite}
.planet{position:absolute;right:-20px;top:70px;opacity:.7;animation:bob 8s ease-in-out infinite}
.shoot{position:absolute;left:-120px;width:110px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(-18deg);animation:shoot 9s linear infinite;opacity:0}
@keyframes shoot{0%{left:-120px;opacity:0}3%{opacity:1}10%{left:110%;opacity:0}100%{left:110%;opacity:0}}
.firefly{position:absolute;width:6px;height:6px;border-radius:50%;background:#e9ff8a;box-shadow:0 0 10px 3px rgba(233,255,138,.6);animation-name:wander,blink2;animation-timing-function:ease-in-out,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:alternate,normal}
@keyframes wander{0%{transform:translate(0,0)}33%{transform:translate(30px,-24px)}66%{transform:translate(-20px,-40px)}100%{transform:translate(18px,10px)}}
@keyframes blink2{0%,100%{opacity:.15}50%{opacity:1}}

.bat{position:absolute;left:0;animation:batfly linear infinite}

function healCheck(){

 var b=S.boss,ph=phase(),top=ph===1?b.max:ph===2?Math.round(b.max*2/3):Math.round(b.max/3);
 var heal=Math.min(top-b.hp,Math.round(b.max*.05*blocks));S.lastChapterStudy=Date.now();

}

 var total=Math.round(h*18);while(total>0&&S.boss.hp>0){var amt=Math.min(total,10+Math.floor(Math.random()*20));dealDamage(MEMBERS[Math.floor(Math.random()*MEMBERS.length)],amt);total-=amt;}
 S.lastChapterStudy=now;save();

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}

 if(c.tier!=="bronze"){S.stars++;items.push({ic:'<span style="color:#ffd23f">'+ic("star","")+'</span>',label:'Skill star',sub:'Spend it in the skill tree (next update)'});}

 if(c.tier!=="bronze"){var mn=c.tier==="gold"?"Rare":null;S.eggQueue.push({min:mn});items.push({ic:eggSVG(34,"",!!mn),label:mn?'Rare+ egg':'Mystery egg',sub:mn?'Guaranteed Rare or better':'Hatch it from Home or Pets',cls:mn?'goldglow':''});}
 var base={bronze:.01,silver:.04,gold:.15}[c.tier],chance=Math.min(.5,base*(1+.1*(c.n-1))),pity=c.tier==="gold"&&S.goldNoPet>=7;
 if(pity||Math.random()<chance){var tk=S.theme,bp=spById(THEMES[tk].bossPet,tk),shiny=Math.random()<SHINY_CHANCE,res=addPet(tk,bp.id,1,shiny),lbl;
  if(res.dup){if(res.p.stage<3){res.p.stage++;lbl=bp.name+' leveled up to '+STAGE_NAME[res.p.stage];}else{S.points+=2000;lbl='+2,000 '+T().currency+' (boss pet maxed)';}}else lbl=(shiny?'SHINY ':'')+bp.name+'!';

 else if(c.tier==="gold")S.goldNoPet++;
 save();return items;

function sk(id){return (S.skills&&S.skills[id])||0;}
function skNode(id){for(var b=0;b<SKILLS.length;b++)for(var i=0;i<SKILLS[b].nodes.length;i++)if(SKILLS[b].nodes[i].id===id)return{b:SKILLS[b],i:i,n:SKILLS[b].nodes[i]};}
function skUnlocked(id){var x=skNode(id);return x.i===0||sk(x.b.nodes[x.i-1].id)>=1;}
function shinyChance(){return SHINY_CHANCE+.01*sk("lucky");}
function focusMult(){return 1.5+.1*sk("focus");}
function comboMax(){return 3+sk("combo");}
function nightBonus(){return .25+.05*sk("owl");}
function slotsCount(){return 1+sk("explorer");}
function price(it){return Math.round(it.price*(1-.1*sk("bargain")));}
function critMult(){return 2+.5*sk("sharp");}
function hitDmg(){return 10+2*sk("power");}
function isNight(d){var h=(d||new Date()).getHours();return h>=21||h<4;}
function nightOn(){return Date.now()<(S.nightUntil||0);}
function comboReady(){return S.combo&&S.combo.n>0&&Date.now()-S.combo.lastEnd<=15*60e3;}
function comboNow(){return comboReady()?Math.min(S.combo.n,comboMax()):0;}
function buddyNow(){var slot=Math.floor(Date.now()/(30*60e3)),r=((slot*9301+49297)%233280)/233280;return r<.6?MEMBERS[slot%MEMBERS.length]:null;}

function weekKey(){var d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dstr(d);}
function pick3(pool){var a=pool.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a.slice(0,3).map(function(q){return{id:q.id,prog:0,claimed:false};});}
function refreshQuests(){
 S.quests=S.quests||{};
 if(!S.quests.day||S.quests.day.date!==dstr())S.quests.day={date:dstr(),list:pick3(QPOOL.day)};
 if(!S.quests.week||S.quests.week.key!==weekKey())S.quests.week={key:weekKey(),list:pick3(QPOOL.week),days:[]};
}
function qdef(kind,id){return QPOOL[kind].filter(function(q){return q.id===id})[0];}
function track(ev,n){
 n=n||1;S.stats=S.stats||{};
 if(ev==="day"){refreshQuests();var w=S.quests.week;if(w.days.indexOf(dstr())>=0)return;w.days.push(dstr());n=1;}
 S.stats[ev]=(S.stats[ev]||0)+n;
 refreshQuests();
 ["day","week"].forEach(function(k){S.quests[k].list.forEach(function(q){var d=qdef(k,q.id);if(d&&d.ev===ev&&!q.claimed){var was=q.prog;q.prog=Math.min(d.goal,q.prog+n);if(was<d.goal&&q.prog>=d.goal)setTimeout(function(){toast("Quest complete: "+d.label)},300);}});});
 checkBadges();
}
function questsClaimable(){refreshQuests();var c=0;["day","week"].forEach(function(k){S.quests[k].list.forEach(function(q){var d=qdef(k,q.id);if(d&&q.prog>=d.goal&&!q.claimed)c++;});});return c;}
function timeLeft(ms){ms=Math.max(0,ms);var h=Math.floor(ms/3600e3),m=Math.floor(ms%3600e3/60e3),s=Math.floor(ms%60e3/1e3);if(h>=24)return Math.floor(h/24)+"d "+(h%24)+"h";if(h)return h+"h "+m+"m";return m+"m "+String(s).padStart(2,"0")+"s";}
function nextMidnight(){var d=new Date();d.setHours(24,0,0,0);return d.getTime();}
function nextMonday(){var d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()+(7-day));d.setHours(0,0,0,0);return d.getTime();}

 if(t===30)return{k:"egg",min:"Legendary",shiny:true,label:"Shiny Legendary egg",big:true};
 if(t===20)return{k:"egg",min:"Legendary",label:"Legendary egg",big:true};
 if(t===10)return{k:"egg",min:"Epic",label:"Epic+ egg",big:true};
 if(t%5===0)return{k:"star",n:2,label:"2 skill stars"};
 var m=t%4;
 if(m===1)return{k:"pts",n:300+t*20,label:"+"+fmt(300+t*20)+" points"};
 if(m===2){var ids=["shield","xp","warp","lucky","dhatch","bell"],id=ids[t%6];return{k:"boost",id:id,label:boostName(id)};}
 if(m===3)return{k:"food",n:400,label:"+400 pet food"};

}

 if(r.k==="pts")S.points+=r.n;
 else if(r.k==="star")S.stars+=r.n;
 else if(r.k==="boost")S.inv[r.id]=(S.inv[r.id]||0)+1;
 else if(r.k==="food"){var p=activePet();if(addFood(p,r.n))track("evolve",1);}

}

function openGrid(){
 G=[];for(var r=0;r<N;r++){G.push([]);for(var c=0;c<N;c++)G[r].push(false);}

function markAt(e){
 var g=$("pgrid");if(!g||!G)return;var b=g.getBoundingClientRect();
 var c=Math.floor((e.clientX-b.left)/b.width*N),r=Math.floor((e.clientY-b.top)/b.height*N);
 c=Math.max(0,Math.min(N-1,c));r=Math.max(0,Math.min(N-1,r));
 if(gLast){var r0=gLast[0],c0=gLast[1],dr=Math.abs(r-r0),dc=Math.abs(c-c0),sr=r0<r?1:-1,sc=c0<c?1:-1,err=dc-dr;
  while(true){fillCell(r0,c0);if(r0===r&&c0===c)break;var e2=2*err;if(e2>-dr){err-=dr;c0+=sc;}if(e2<dc){err+=dc;r0+=sr;}}}

function isP(){
 if(!G)return false;var r0=N,r1=-1,c0=N,c1=-1,cnt=0;
 for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(G[r][c]){cnt++;r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
 if(cnt<12)return false;var H=r1-r0+1,W=c1-c0+1;if(H<7||W<4||H<W)return false;
 function has(r,a,b){for(var c=a;c<=b;c++)if(G[r][c])return true;return false;}
 function rc(r){var k=0;for(var c=c0;c<=c1;c++)if(G[r][c])k++;return k;}
 var stem=0;for(r=r0;r<=r1;r++)if(has(r,c0,c0+1))stem++;if(stem/H<.85)return false;
 if(Math.max(rc(r0),rc(r0+1))<W*.55)return false;
 var mid=-1;for(r=r0+Math.max(3,Math.floor(H*.3));r<=r0+Math.ceil(H*.7);r++)if(rc(r)>=W*.55){mid=r;break;}
 if(mid<0)return false;
 var right=0,span=0;for(r=r0+1;r<mid;r++){span++;if(has(r,c1-1,c1))right++;}if(!span||right/span<.6)return false;
 var rh=c0+Math.ceil(W/2),bad=0,bs=0;for(r=mid+2;r<=r1;r++){bs++;if(has(r,rh,c1))bad++;}
 if(bs<2||bad/bs>.2)return false;
 return true;
}

 [["pts","+10,000 points"],["lvl","+10 levels"],["energy","+50 energy"],["egg","Egg ready now"],["themes","Unlock all themes"],["maxall","Max every pet I own"],["allpets","Give every pet"],["boss5","Boss to 5% HP"],["heal","Skip 12 hrs (boss heals)"],["gold","Give a gold chest"],["silver","Give a silver chest"],["streak","Streak = 100"],["stars","+5 skill stars"],["passxp","+3,000 pass XP"],["quests","Finish all quests"],["exp","Finish expeditions now"],["newq","New quests"],["combo","Combo ready (×1.3)"]].map(function(q){return '<button class="btn2" style="font-size:13px;height:44px" data-a="aq" data-q="'+q[0]+'">'+q[1]+'</button>';}).join("")+'</div></section>'+
 '<section class="card"><h2 style="font-size:17px;margin-bottom:10px">Give any pet</h2><div class="tabs" style="margin-bottom:10px">'+THEME_ORDER.map(function(k){return '<button class="'+(a.theme===k?'on':'')+'" data-a="atheme" data-t="'+k+'">'+THEMES[k].name+'</button>';}).join("")+'</div>'+
 '<div class="seg" style="margin-bottom:8px">'+[1,2,3].map(function(n){return '<button class="'+(a.stage===n?'on':'')+'" style="height:44px;font-size:14px" data-a="astage" data-n="'+n+'">'+STAGE_NAME[n]+'</button>';}).join("")+'</div>'+
 '<button class="toggle" style="margin-bottom:10px" data-a="ashiny" aria-pressed="'+a.shiny+'"><span style="flex:1"><b style="display:block;font-size:14px">Give as shiny</b></span><span class="sw"></span></button>'+
 '<div class="grid3">'+pets+'</div><button class="btn2" style="width:100%;flex:none;margin-top:10px" data-a="athemeall">Give all '+th.name+' pets at '+STAGE_NAME[a.stage]+'</button></section>'+
 '</div></div>');
 var nw=document.querySelector(".admin");if(nw&&st){nw.style.animation="none";nw.scrollTop=st;}
}
function giveAdm(tk,id,stage,shiny){ensureStarter(tk);var list=S.pets[tk],p=null;for(var i=0;i<list.length;i++)if(list[i].s===id)p=list[i];
 if(p){p.stage=stage;p.food=0;if(shiny)p.shiny=true;}else{var np={s:id,stage:stage,food:0};if(shiny)np.shiny=true;list.push(np);}}

app.addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a;
 if(a==="bgclose"){if(e.target===el)closeOverlay();return;}
 if(el.getAttribute("aria-disabled")==="true")return;
 switch(a){
  case "tab":ui.tab=el.dataset.tab;if(ui.tab==="pets"){ui.petTheme=S.theme;}closeOverlay();render(true);$("screen").scrollTop=0;break;
  case "feed":feed();break;
  case "poke":var s=el.querySelector("svg");s.classList.remove("squish");void s.getBoundingClientRect();s.classList.add("squish");break;
  case "setpet":if(isBusy(el.dataset.t||S.theme,el.dataset.id)){toast("That pet is on an expedition");break;}if(el.dataset.t&&el.dataset.t!==S.theme){toast("Equip "+THEMES[el.dataset.t].name+" in Themes to use this pet");break;}S.active[S.theme]=el.dataset.id;save();if(el.dataset.close)closeOverlay();render();toast(spById(el.dataset.id).name+" is your study buddy now");break;
  case "pettheme":ui.petTheme=el.dataset.t;render();break;
  case "seg":ui[el.dataset.k]=el.dataset.v;render();break;
  case "tnext":showIntro(+el.dataset.i+1);break;
  case "tprev":showIntro(+el.dataset.i-1);break;
  case "tdone":case "tskip":finishIntro();break;
  case "tournext":startTour(+el.dataset.i+1);break;
  case "tourend":S.tut.tour=1;S.tut.seen.home=1;save();tutLayer("");break;
  case "tipclose":if(a==="tipclose"&&el.classList.contains("backdrop")&&e.target!==el)break;tutLayer("");break;
  case "help":if($("overlay").innerHTML&&document.querySelector(".arena"))showTip("arena",true);else showTip(tipKey(),true);break;
  case "replayintro":showIntro(0);break;
  case "replaytour":S.tut.tour=0;save();ui.tab="home";render(true);$("screen").scrollTop=0;setTimeout(function(){startTour(0);},400);break;
  case "resettips":S.tut.seen={home:1};save();toast("Tips will show again on each screen");break;
  case "goto":ui.tab=el.dataset.tab;if(el.dataset.k)ui[el.dataset.k]=el.dataset.v;closeOverlay();render(true);$("screen").scrollTop=0;break;
  case "qclaim":var qk=el.dataset.kind,qq=S.quests[qk].list.filter(function(x){return x.id===el.dataset.id})[0],qd=qdef(qk,el.dataset.id);if(!qq||qq.claimed)break;qq.claimed=true;S.points+=qd.pts;S.pass.xp+=qd.xp;save();render();bump();toast("+"+qd.pts+" "+T().currency+" · +"+qd.xp+" pass XP");break;
  case "pclaim":var tt3=+el.dataset.t;if(tt3<=passTier()&&S.pass.claimed.indexOf(tt3)<0){var rw=passReward(tt3);giveReward(rw);S.pass.claimed.push(tt3);save();render();toast("Tier "+tt3+": "+rw.label);if(rw.big)confetti(120);}break;
  case "pclaimall":for(var ti=1;ti<=passTier();ti++)if(S.pass.claimed.indexOf(ti)<0){giveReward(passReward(ti));S.pass.claimed.push(ti);}save();render();confetti(80);toast("All pass rewards claimed");break;
  case "learn":var nid=el.dataset.id,nd=skNode(nid);if(S.stars<1){toast("No skill stars. Level up or earn badges to get more!");break;}if(sk(nid)>=nd.n.max||!skUnlocked(nid))break;S.stars--;S.skills[nid]=sk(nid)+1;save();render();toast(nd.n.name+": "+nd.n.eff(sk(nid)));break;
  case "respec":var refund=0;for(var k2 in S.skills)refund+=S.skills[k2];S.skills={};S.stars+=refund;save();render();toast("Refunded "+refund+" skill stars");break;
  case "bclaim":var bd=BADGES.filter(function(x){return x.id===el.dataset.id})[0];if(!bd||S.badges[bd.id]||!badgeDone(bd))break;S.badges[bd.id]=1;S.stars++;S.points+=250;save();render();confetti(60);toast(bd.name+": +1 skill star, +250 points");break;
  case "expnew":ui.expPick={slot:+el.dataset.slot,pet:null};expSheet();break;
  case "exppet":ui.expPick.pet=ui.expList[+el.dataset.k];expSheet();break;
  case "expback":ui.expPick.pet=null;expSheet();break;
  case "expgo":var ep=ui.expPick.pet;S.exp.slots[ui.expPick.slot]={tk:ep.tk,s:ep.p.s,h:+el.dataset.h,start:Date.now()};track("expstart",1);save();closeOverlay();render();toast(ep.sp.name+" set off for "+EXPL[ep.tk][EXP_H.indexOf(+el.dataset.h)]+"!");break;
  case "expcollect":collectExp(+el.dataset.slot);break;
  case "hatch":hatchModal();break;
  case "crack":crack();break;
  case "close":closeOverlay();render();break;
  case "collect":closeOverlay();render();bump();break;
  case "pre":preSheet();break;
  case "plen":ui.pre.len=+el.dataset.m;preSheet();break;
  case "ptog":ui.pre[el.dataset.k]=!ui.pre[el.dataset.k];preSheet();break;
  case "start":startSession();break;
  case "pause":sess.run=!sess.run;el.textContent=sess.run?"Pause":"Resume";break;
  case "speed":sess.speed=sess.speed===1?60:1;el.textContent="Test speed "+sess.speed+"×";if(sess.speed>1)toast("Test mode: 1 second = 1 minute");break;
  case "end":finish(false);break;
  case "arena":openArena();break;
  case "hit":attack(false,e);break;
  case "crit":attack(true,e);break;
  case "openchest":openChest();break;
  case "tapchest":tapChest();break;
  case "buy":var it=SHOP.filter(function(i){return i.id===el.dataset.id})[0];
   var pr=price(it);if(S.points<pr){toast("Need "+fmt(pr-S.points)+" more "+T().currency);break;}
   S.points-=pr;if(it.id==="night"){S.nightUntil=Math.max(Date.now(),S.nightUntil||0)+7*864e5;}else S.inv[it.id]=(S.inv[it.id]||0)+1;save();render();bump();toast("Bought "+boostName(it.id));break;
  case "equip":if(S.theme===el.dataset.id)break;S.theme=el.dataset.id;ensureStarter(S.theme);save();render();toast("Welcome to "+T().name);confetti(50);break;
  case "unlock":var th=THEMES[el.dataset.id];
   if(S.totalMin/60>=th.unlockHrs){S.unlocked.push(el.dataset.id);ensureStarter(el.dataset.id);save();render();toast(th.name+" unlocked!");confetti(90);}
   else toast("Study "+(+(th.unlockHrs-S.totalMin/60).toFixed(1))+" more hours to unlock");break;
  case "reset":S=fresh();migrate();save();render(true);toast("Demo data reset");break;
  case "gclear":G.forEach(function(row){for(var c=0;c<N;c++)row[c]=false;});var g=$("pgrid");if(g){g.classList.remove("ok");[].forEach.call(g.children,function(d){d.classList.remove("on")});}break;
  case "asave":[].forEach.call(document.querySelectorAll(".admin input[data-k]"),function(inp){admSet(inp.dataset.k,inp.value);});save();render();toast("Stats saved");break;
  case "aq":var q=el.dataset.q;
   if(q==="pts")S.points+=10000;if(q==="lvl")S.xp+=10000;if(q==="energy")S.energy+=50;if(q==="egg")S.eggMin=EGG_MIN;if(q==="streak")S.streak=100;
   if(q==="stars")S.stars+=5;if(q==="passxp")S.pass.xp+=3000;
   if(q==="quests"){refreshQuests();["day","week"].forEach(function(k){S.quests[k].list.forEach(function(x){var d=qdef(k,x.id);x.prog=d.goal;});});}
   if(q==="exp")S.exp.slots.forEach(function(x){if(x)x.start=Date.now()-x.h*3600e3-1000;});
   if(q==="newq"){S.quests={};refreshQuests();}
   if(q==="combo")S.combo={n:3,lastEnd:Date.now()};
   if(q==="boss5")S.boss.hp=Math.max(1,Math.round(S.boss.max*.05));
   if(q==="heal"){S.lastChapterStudy-=12*3600e3;var hh=healCheck();toast(hh?bossName()+" healed "+fmt(hh)+" HP":"Already at the top of its phase");save();render();openAdmin();break;}
   if(q==="gold"||q==="silver")S.chests.push({tier:q,n:S.boss.n,theme:S.theme});
   if(q==="themes"){S.unlocked=THEME_ORDER.slice();THEME_ORDER.forEach(ensureStarter);}
   if(q==="maxall")THEME_ORDER.forEach(function(k){myPets(k).forEach(function(p){p.stage=3;p.food=0;});});
   if(q==="allpets")THEME_ORDER.forEach(function(k){THEMES[k].species.forEach(function(sp){var has=myPets(k).some(function(p){return p.s===sp.id;});if(!has)giveAdm(k,sp.id,ui.adm.stage,ui.adm.shiny);});});
   save();render();openAdmin();toast("Done");break;
  case "atheme":ui.adm.theme=el.dataset.t;openAdmin();break;
  case "astage":ui.adm.stage=+el.dataset.n;openAdmin();break;
  case "ashiny":ui.adm.shiny=!ui.adm.shiny;openAdmin();break;
  case "agive":giveAdm(ui.adm.theme,el.dataset.id,ui.adm.stage,ui.adm.shiny);if(S.unlocked.indexOf(ui.adm.theme)<0)S.unlocked.push(ui.adm.theme);save();render();openAdmin();toast(spById(el.dataset.id,ui.adm.theme).name+" → "+STAGE_NAME[ui.adm.stage]+(ui.adm.shiny?" ✦":""));break;
  case "athemeall":THEMES[ui.adm.theme].species.forEach(function(sp){giveAdm(ui.adm.theme,sp.id,ui.adm.stage,ui.adm.shiny);});if(S.unlocked.indexOf(ui.adm.theme)<0)S.unlocked.push(ui.adm.theme);save();render();openAdmin();toast("All "+THEMES[ui.adm.theme].name+" pets given");break;
 }
});

healCheck();offlineSim();
render(true);
if(!S.tut.intro)setTimeout(function(){showIntro(0);},300);
if(S.boss.hp<=0)setTimeout(defeat,600);
})();

</script>

 document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
